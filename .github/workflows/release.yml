name: Build and release

# Every push to main builds and uploads the binaries as a workflow artifact.
# Pushing a tag like v1.2.0 additionally publishes a GitHub release with
# SHA-256 checksums and signed build-provenance attestations, so anyone can
# verify that a download was built from this repository by this workflow.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write       # create the release
      id-token: write       # sign the attestation (Sigstore)
      attestations: write   # store the attestation
      actions: read         # lets SignPath fetch the unsigned artifact
    env:
      # Code signing switches on by itself once the repository has the
      # SIGNPATH_API_TOKEN secret (and the SIGNPATH_ORGANIZATION_ID variable).
      SIGN: ${{ github.ref_type == 'tag' && secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            $v = "0.0.0-dev.$env:GITHUB_RUN_NUMBER+$($env:GITHUB_SHA.Substring(0, 7))"
          }
          "version=$v" >> $env:GITHUB_OUTPUT

      # No -G: CMake picks the newest Visual Studio on the runner image.
      - name: Configure
        run: |
          cmake --version
          cmake -B build -A x64 "-DFB_VERSION=${{ steps.version.outputs.version }}"

      - name: Build
        run: cmake --build build --config Release

      # ---- Code signing via SignPath Foundation (tags only, approved by hand) ----
      - name: Upload unsigned exe for signing
        id: unsigned
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-${{ github.run_number }}
          path: build/Release/floatbar.exe

      - name: Sign with SignPath
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: FloatBar
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use and check the signed exe
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item signed/floatbar.exe build/Release/floatbar.exe -Force
          $sig = Get-AuthenticodeSignature build/Release/floatbar.exe
          "$($sig.Status): $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "floatbar.exe is not validly signed" }

      # The release is a single file: floatbar.exe (+ its checksum), hashed after signing.
      - name: Hash
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/floatbar.exe dist/
          $hash = (Get-FileHash dist/floatbar.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  floatbar.exe" | Out-File -Encoding ascii dist/SHA256SUMS.txt
          Get-Content dist/SHA256SUMS.txt

      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/floatbar.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FloatBar-${{ github.run_number }}
          path: dist/

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            ### Verify your download

            **Checksum:** compare with `SHA256SUMS.txt` from this release.
            ```powershell
            Get-FileHash .\floatbar.exe -Algorithm SHA256
            ```

            **Build provenance:** proves the file was built from this repository by GitHub Actions
            (needs the GitHub CLI, https://cli.github.com).
            ```powershell
            gh attestation verify .\floatbar.exe --repo ${{ github.repository }}
            ```
